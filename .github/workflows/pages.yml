name: Deploy public site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html istanbul.html istanbul-data.js visa.html visa-content.html visa-form-helper.html .nojekyll _site/
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick fonts-dejavu-core >/dev/null
          rsvg-convert -w 600 -h 315 og-home.svg -o /tmp/home.png
          rsvg-convert -w 600 -h 315 og-istanbul.svg -o /tmp/istanbul.png
          rsvg-convert -w 600 -h 315 og-visa.svg -o /tmp/visa.png
          convert /tmp/home.png -strip -quality 88 _site/og-home.jpg
          convert /tmp/istanbul.png -strip -quality 88 _site/og-istanbul.jpg
          convert /tmp/visa.png -strip -quality 88 _site/og-visa.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
