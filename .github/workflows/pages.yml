# Public Pages deployment
name: Deploy public site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html istanbul.html istanbul-data.js visa.html visa-content.html visa-form-helper.html .nojekyll _site/
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          convert og-home-final.png -resize 1200x630! -strip -interlace none -sampling-factor 4:2:0 -quality 82 _site/og-home-final-v2.jpg
          convert og-istanbul-final.png -resize 1200x630! -strip -interlace none -sampling-factor 4:2:0 -quality 82 _site/og-istanbul-final-v2.jpg
          convert og-visa-final.png -resize 1200x630! -strip -interlace none -sampling-factor 4:2:0 -quality 82 _site/og-visa-final-v2.jpg
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
