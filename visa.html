<style>
:root{--red:#c62f38;--red-dark:#a91f28;--line:#e5e7eb;--bg:#f4f5f7;--text:#171b22}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}
.bar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(10px,calc((100% - 780px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.97);position:relative;z-index:10;box-shadow:0 3px 14px rgba(20,27,35,.05)}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#282d34;font-weight:800;font-size:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:#555d68}.dot{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--red-dark),var(--red));display:grid;place-items:center;color:white;font-size:10px}
.frame{width:100%;height:calc(100vh - 58px);border:0;display:block;background:var(--bg)}
@media(max-width:600px){.bar{padding:8px 10px}.brand span{display:none}}
</style>
</head>
<body>
<div class="bar"><a class="back" href="index.html">‹ الرئيسية</a><div class="brand"><span>التقديم على الفيزا التركية</span><div class="dot">TR</div></div></div>
<iframe class="frame" src="visa-content.html" title="قائمة متطلبات الفيزا التركية"></iframe>
</body>
